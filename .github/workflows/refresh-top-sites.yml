name: Refresh Top Sites Directory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ranked Top 1,000 catalog
        run: python tools/echo_miner.py --list-id latest --count 1000
      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- data/top-sites.json; then
            echo "Top Sites catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/top-sites.json
          git commit -m "Refresh Tranco Top 1000 directory data"
          git push
