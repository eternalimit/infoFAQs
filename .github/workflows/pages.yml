name: Publish InfoFAQs
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Test crafting engine core
        run: node --test scripts/craft-engine.test.mjs scripts/artifact-library.test.mjs
      - name: Generate ranked Top 1,000 directory data
        run: python3 tools/echo_miner.py --list-id latest --count 1000
      - name: Prepare public allowlist only
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site/data
          for file in index.html 404.html robots.txt robot.txt sitemap.xml business-profile.json CNAME catbot100.html 10-faqs.html marketplace.html marketplace-preview.html top-sites.html craft-engine.mjs artifact-library.mjs; do
            test -f "$file"
            test ! -L "$file"
              cp "$file" "_site/$file"
          done
          test -f data/top-sites.json
          test ! -L data/top-sites.json
          cp data/top-sites.json _site/data/top-sites.json
          mkdir -p _site/bin
          test -f bin/index.html
          test ! -L bin/index.html
          cp bin/index.html _site/bin/index.html
          mkdir -p _site/mine/uni
          test -f mine/uni/index.html
          test ! -L mine/uni/index.html
          cp mine/uni/index.html _site/mine/uni/index.html
          mkdir -p _site/gateway/genesis
          for file in index.html README.md COSMO8.md BACKWARDS_PROTOCOL.md; do
            test -f "gateway/genesis/$file"
            test ! -L "gateway/genesis/$file"
            cp "gateway/genesis/$file" "_site/gateway/genesis/$file"
          done
          mkdir -p _site/receipt
          test -f receipt/index.html
          test ! -L receipt/index.html
          cp receipt/index.html _site/receipt/index.html
          mkdir -p _site/genesis
          test -f genesis/by-monroe.html
          test ! -L genesis/by-monroe.html
          cp genesis/by-monroe.html _site/genesis/by-monroe.html
          mkdir -p _site/board
          test -f board/lipin.html
          test ! -L board/lipin.html
          cp board/lipin.html _site/board/lipin.html
          cmp robots.txt robot.txt
          touch _site/.nojekyll
          test "$(find _site -type f | wc -l)" -eq 25
          test ! -e _site/marketplace
          test ! -e _site/ARCHIVE
          test ! -e _site/the-cube
      - name: Gate 5 validate exact public artifact before deployment
        run: python3 scripts/gate5_artifact_preflight.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
