name: Publish InfoFAQs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public allowlist only
        run: |
          set -eu
          rm -rf _site
          mkdir _site
          for file in index.html 404.html robots.txt sitemap.xml CNAME; do
            test -f "$file"
            test ! -L "$file"
            cp "$file" "_site/$file"
          done
          touch _site/.nojekyll
          test "$(find _site -type f | wc -l)" -eq 6
          test ! -e _site/marketplace
          test ! -e _site/ARCHIVE
          test ! -e _site/the-cube
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
