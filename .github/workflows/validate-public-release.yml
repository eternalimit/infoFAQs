name: Validate public InfoFAQs release
on:
  pull_request:
  push:
    branches:
      - fix/public-homepage-real-product-2026
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test crafting engine core
        run: node --test scripts/craft-engine.test.mjs scripts/artifact-library.test.mjs
      - name: Validate public site and crawl files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      d=dict(attrs)
                      if 'href' in d:self.links.append(d['href'])
          root=Path('.')
          html=(root/'index.html').read_text()
          assert '© 2026 Richard Nathan Stein. All rights reserved.' in html
          for phrase in ('CATBOT 100','10 FAQs for Partners','The Human Green Button','MINE.UNI'):
              assert phrase in html,phrase
          assert 'Private Edition 0 materials are not published' in html
          p=Links();p.feed(html)
          missing=[]
          for link in p.links:
              if link.startswith(('http:','https:','mailto:','#','tel:','javascript:')):continue
              target=link.split('#',1)[0].split('?',1)[0]
              if not target:continue
              f=root/target.lstrip('/')
              if f.is_dir():f=f/'index.html'
              if not f.is_file():missing.append(link)
          assert not missing, f'Broken local homepage links: {missing}'
          robots=(root/'robots.txt').read_text()
          assert 'Sitemap: https://infofaqs.com/sitemap.xml' in robots
          sitemap=ET.parse(root/'sitemap.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[e.text for e in sitemap.findall('.//s:loc',ns)]
          assert urls and all(u.startswith('https://infofaqs.com/') for u in urls)
          for url in urls:
              target=url.removeprefix('https://infofaqs.com/').split('?',1)[0]
              f=root/target
              if not target or f.is_dir():f=f/'index.html'
              assert f.is_file(),f'Missing sitemap target: {url}'
          print('PASS: homepage assets, protected labels, robots, sitemap, and local links')
          PY
      # Exact same artifact build and fail-closed preflight as production, without deployment.
      - name: Generate ranked Top 1,000 directory data
        run: python3 tools/echo_miner.py --list-id latest --count 1000
      - name: Prepare public allowlist only
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site/data
          for file in index.html 404.html robots.txt robot.txt sitemap.xml business-profile.json CNAME catbot100.html 10-faqs.html marketplace.html marketplace-preview.html top-sites.html craft-engine.mjs artifact-library.mjs; do
            test -f "$file"
            test ! -L "$file"
              cp "$file" "_site/$file"
          done
          test -f data/top-sites.json
          test ! -L data/top-sites.json
          cp data/top-sites.json _site/data/top-sites.json
          mkdir -p _site/bin
          test -f bin/index.html
          test ! -L bin/index.html
          cp bin/index.html _site/bin/index.html
          mkdir -p _site/mine/uni
          test -f mine/uni/index.html
          test ! -L mine/uni/index.html
          cp mine/uni/index.html _site/mine/uni/index.html
          mkdir -p _site/gateway/genesis
          for file in index.html README.md COSMO8.md BACKWARDS_PROTOCOL.md; do
            test -f "gateway/genesis/$file"
            test ! -L "gateway/genesis/$file"
            cp "gateway/genesis/$file" "_site/gateway/genesis/$file"
          done
          mkdir -p _site/infofaq
          test -f infofaq/index.html
          test ! -L infofaq/index.html
          cp infofaq/index.html _site/infofaq/index.html
          mkdir -p _site/receipt
          test -f receipt/index.html
          test ! -L receipt/index.html
          cp receipt/index.html _site/receipt/index.html
          cmp robots.txt robot.txt
          touch _site/.nojekyll
          test "$(find _site -type f | wc -l)" -eq 24
          test ! -e _site/marketplace
          test ! -e _site/ARCHIVE
          test ! -e _site/the-cube
      - name: Gate 5 validate exact public artifact before deployment
        run: python3 scripts/gate5_artifact_preflight.py
